services:
  postgres-keycloak:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${SNAPSENDS3_KEYCLOAK_DATABASE_PASSWORD:?Set SNAPSENDS3_KEYCLOAK_DATABASE_PASSWORD in .env}
    volumes: ["keycloak-postgres-data:/var/lib/postgresql/data"]
  keycloak:
    command: start --import-realm --http-enabled=true --http-relative-path=/auth --hostname=${SNAPSENDS3_PUBLIC_ORIGIN}/auth --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${SNAPSENDS3_KEYCLOAK_DATABASE_PASSWORD:?Set SNAPSENDS3_KEYCLOAK_DATABASE_PASSWORD in .env}
    depends_on: [postgres-keycloak]
  api:
    depends_on: [postgres, clamav, keycloak]
  caddy:
    ports: ["80:80", "443:443"]
volumes:
  keycloak-postgres-data:
