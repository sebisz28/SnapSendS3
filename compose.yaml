services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snapsends3
      POSTGRES_USER: snapsends3
      POSTGRES_PASSWORD: ${SNAPSENDS3_DATABASE_PASSWORD:-snapsends3}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  postgres-e2e:
    image: postgres:16-alpine
    profiles: ["e2e"]
    environment:
      POSTGRES_DB: snapsends3
      POSTGRES_USER: snapsends3
      POSTGRES_PASSWORD: snapsends3
  clamav:
    image: clamav/clamav:1.4_base
    ports: ["3310:3310"]
  minio:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: snapsends3
      AWS_SECRET_ACCESS_KEY: snapsends3-local-only
    ports: ["9000:4566"]
    volumes: ["./ops/localstack:/etc/localstack/init/ready.d:ro"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm --http-relative-path=/auth --hostname=${SNAPSENDS3_PUBLIC_ORIGIN:-https://localhost:8443}/auth --proxy-headers=xforwarded
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SNAPSENDS3_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SNAPSENDS3_KEYCLOAK_ADMIN_PASSWORD:-admin}
      SNAPSENDS3_PUBLIC_ORIGIN: ${SNAPSENDS3_PUBLIC_ORIGIN:-https://localhost:8443}
    ports: ["8180:8080"]
    volumes:
      - ./ops/keycloak:/opt/keycloak/data/import:ro
      - ./ops/keycloak/themes/snapsends3:/opt/keycloak/themes/snapsends3:ro
  api:
    build: ./apps/api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/snapsends3
      SPRING_DATASOURCE_USERNAME: snapsends3
      SPRING_DATASOURCE_PASSWORD: ${SNAPSENDS3_DATABASE_PASSWORD:-snapsends3}
      SNAPSENDS3_R2_ENDPOINT: ${SNAPSENDS3_R2_ENDPOINT:-http://minio:4566}
      SNAPSENDS3_R2_PUBLIC_ENDPOINT: ${SNAPSENDS3_R2_PUBLIC_ENDPOINT:-https://localhost:8443}
      SNAPSENDS3_R2_BUCKET: ${SNAPSENDS3_R2_BUCKET:-snapsends3}
      SNAPSENDS3_R2_ACCESS_KEY_ID: ${SNAPSENDS3_R2_ACCESS_KEY_ID:-snapsends3}
      SNAPSENDS3_R2_SECRET_ACCESS_KEY: ${SNAPSENDS3_R2_SECRET_ACCESS_KEY:-snapsends3-local-only}
      SNAPSENDS3_CLAMAV_HOST: clamav
      SNAPSENDS3_KEYCLOAK_ISSUER_URI: ${SNAPSENDS3_KEYCLOAK_ISSUER_URI:-https://localhost:8443/auth/realms/snapsends3}
      SNAPSENDS3_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/snapsends3/protocol/openid-connect/certs
    depends_on: [postgres, clamav, minio, keycloak]
  caddy:
    build: .
    ports: ["${SNAPSENDS3_HTTPS_PORT:-8443}:443"]
    environment:
      SNAPSENDS3_PUBLIC_HOST: ${SNAPSENDS3_PUBLIC_HOST:-localhost}
    depends_on: [api, keycloak]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
  api-e2e:
    build:
      context: ./apps/api
    profiles: ["e2e"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-e2e:5432/snapsends3
      SPRING_DATASOURCE_USERNAME: snapsends3
      SPRING_DATASOURCE_PASSWORD: snapsends3
      SNAPSENDS3_R2_ENDPOINT: http://minio:4566
      SNAPSENDS3_R2_PUBLIC_ENDPOINT: https://localhost:8443
      SNAPSENDS3_R2_BUCKET: snapsends3
      SNAPSENDS3_R2_ACCESS_KEY_ID: snapsends3
      SNAPSENDS3_R2_SECRET_ACCESS_KEY: snapsends3-local-only
      SNAPSENDS3_CLAMAV_HOST: clamav
      SNAPSENDS3_KEYCLOAK_ISSUER_URI: https://localhost:8443/auth/realms/snapsends3
      SNAPSENDS3_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/snapsends3/protocol/openid-connect/certs
    depends_on:
      - postgres-e2e
      - clamav
      - minio
      - keycloak
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
